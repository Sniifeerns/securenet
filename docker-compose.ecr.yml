services:
  gateway:
    container_name: securenet-gateway
    image: 812752207341.dkr.ecr.eu-west-3.amazonaws.com/securenet-gateway:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "gateway"
    restart: unless-stopped

  frontend:
    container_name: securenet-frontend
    image: 812752207341.dkr.ecr.eu-west-3.amazonaws.com/securenet-frontend:latest
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "frontend"
    restart: unless-stopped

  api:
    container_name: securenet-api
    image: 812752207341.dkr.ecr.eu-west-3.amazonaws.com/securenet-api:latest
    environment:
      - PORT=3001
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_ACCOUNT_ID=${NEW_RELIC_ACCOUNT_ID}
      - NEW_RELIC_API_KEY=${NEW_RELIC_API_KEY}
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "api"
    restart: unless-stopped
      
  n8n:
    container_name: securenet-n8n
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    # volumes:
    #   - ./docker/n8n/data:/home/node/.n8n
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "n8n"
    restart: unless-stopped

networks:
  dmz:
    driver: bridge
