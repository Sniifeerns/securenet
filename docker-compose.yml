services:
  gateway:
    container_name: securenet-gateway
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/gateway/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "gateway"
    restart: unless-stopped

  frontend:
    container_name: securenet-frontend
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "frontend"
    restart: unless-stopped

  api:
    container_name: securenet-api
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    environment:
      - PORT=3001
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_ACCOUNT_ID=${NEW_RELIC_ACCOUNT_ID}
      - NEW_RELIC_API_KEY=${NEW_RELIC_API_KEY}
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "api"
    restart: unless-stopped
  n8n:
    container_name: securenet-n8n
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./docker/n8n/data:/home/node/.n8n
    networks:
      - dmz
    labels:
      com.newrelic.monitor: "true"
      com.newrelic.app: "securenet"
      com.newrelic.service: "n8n"
    restart: unless-stopped

networks:
  dmz:
    driver: bridge